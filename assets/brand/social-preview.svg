<text x="56" y="195" fill="#F3F8F6" font-size="70" font-weight="700">From agent risks</text>
<text x="56" y="280" fill="#F3F8F6" font-size="70" font-weight="700">to controls</text>
<text x="56" y="365" fill="#8FF0D1" font-size="70" font-weight="700">you can verify.</text>
<text x="61" y="427" fill="#B6CDD0" font-size="24">Open-source controls. Runnable examples. Explicit limits.</text>
