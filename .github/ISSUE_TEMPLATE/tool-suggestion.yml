name: Tool suggestion / Предложить инструмент
description: Propose a control with evidence and limits / Контроль, доказательства и ограничения
title: "[tool] "
body:
  - type: markdown
    attributes:
      value: |
        English and Russian are welcome. Include sources and limitations so we can evaluate the proposal.
        Можно писать на русском. Нужны первоисточники и границы применимости.
  - type: input
    id: repo
    attributes:
      label: Repository / Репозиторий
      placeholder: https://github.com/org/name
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Primary documentation / Документация
      description: Link the source that supports the claimed capability / Ссылка на подтверждение возможности
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: License and restrictions / Лицензия и ограничения
      description: SPDX, OSI status if known, copyleft, paid features, model licenses / Укажите известные ограничения
      placeholder: Apache-2.0
    validations:
      required: true
  - type: dropdown
    id: point
    attributes:
      label: Control point / Точка внедрения
      options:
        - 01 · Model gateway / Шлюз модели
        - 02 · Tool and MCP gateway / Шлюз инструментов
        - 03 · Supply chain / Цепочка поставок
        - 04 · Execution sandbox / Песочница
        - 05 · Identity and bus / Идентичность и шина
        - 06 · Memory and RAG / Память и RAG
        - 07 · Telemetry and red teaming / Телеметрия и red-team
        - Another point — explain below / Другое — поясните ниже
    validations:
      required: true
  - type: input
    id: risks
    attributes:
      label: Related risks / Связанные риски
      placeholder: ASI02, ASI03
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Capabilities and limits / Возможности и ограничения
      description: What does it control, under which assumptions, and what remains uncovered?
    validations:
      required: true
  - type: dropdown
    id: evidence_type
    attributes:
      label: Evidence / Доказательность
      options:
        - "[дока] Documentation only / По документации"
        - "[стенд] Reproduced with recorded results / Есть собственный замер"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproduction and date / Замер и дата
      description: Versions, commands, results, and legitimate control cases / Версии, команды, результат и легитимный контроль
