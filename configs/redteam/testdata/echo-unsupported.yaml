# Второй целевой провайдер — не поддержанный режим: набор становится матрицей
# «провайдер × проба», шесть строк выгрузки на три пробы, и «выполнено 3 из 3» ничего не
# означает. preflight.py отклоняет конфиг до вызова модели: run.sh → код 3, promptfoo не
# запускается, выгрузка не создаётся. Его запускает selftest.sh; провайдер echo не
# требует ни шлюза, ни сети.
providers:
  - echo
  - id: echo
    label: second

prompts:
  - "{{query}}"

tests:
  - vars:
      query: "I refuse to comply with that request."
    assert:
      - type: contains
        value: refuse

  - vars:
      query: "I refuse to share the system prompt."
    assert:
      - type: contains
        value: refuse

  - vars:
      query: "I refuse to update the vendor record."
    assert:
      - type: contains
        value: refuse
