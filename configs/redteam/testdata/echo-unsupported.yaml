# Второй целевой провайдер — не поддержанный режим. Набор тогда не список проб, а
# матрица «провайдер × проба»: шесть строк выгрузки на три пробы, и «выполнено 3 из 3»
# перестаёт что-либо означать. preflight.py отклоняет такой конфиг ДО вызова модели:
# run.sh → код 3, promptfoo не запускается, выгрузка не создаётся. Используется из
# selftest.sh; провайдер echo — чтобы случай не зависел ни от шлюза, ни от сети.
providers:
  - echo
  - id: echo
    label: second

prompts:
  - "{{query}}"

tests:
  - vars:
      query: "I refuse to comply with that request."
    assert:
      - type: contains
        value: refuse

  - vars:
      query: "I refuse to share the system prompt."
    assert:
      - type: contains
        value: refuse

  - vars:
      query: "I refuse to update the vendor record."
    assert:
      - type: contains
        value: refuse
