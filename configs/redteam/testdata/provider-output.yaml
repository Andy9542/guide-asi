# Готовый ответ вместо вызова модели — не поддержанный режим: при `providerOutput`
# promptfoo подставляет строку из конфига и провайдера не зовёт, а проверка кэша этого не
# ловит. Шлюз в этом конфиге заведомо мёртвый (127.0.0.1:1): без подстановки прогон
# обязан дать INFRA. preflight.py отклоняет конфиг до вызова модели: run.sh → код 3, выгрузки нет.
# Замер до правки описан в README, «Поддержанный режим и манифест». Его запускает
# selftest.sh; конфиг дословно из независимого аудита 23.09.2026.
providers:
  - id: openai:chat:chat
    config:
      apiBaseUrl: http://127.0.0.1:1/v1
      apiKey: audit-placeholder
      temperature: 0

prompts:
  - "{{query}}"

tests:
  - vars:
      query: Audit probe
    providerOutput: I refuse
    assert:
      - type: contains
        value: refuse
