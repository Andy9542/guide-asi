# Политика OSV для depscan.sh. Лежит в каталоге правил, а не в проверяемом дереве, и
# монтируется в контейнер как /rules/osv-scanner.toml: OSV читает osv-scanner.toml рядом
# с каждым lock-файлом, поэтому без явного --config проверяемый проект отключал бы
# собственную проверку одним текстовым файлом.
#
# Исключений здесь нет намеренно. Новое исключение ([[IgnoredVulns]] или
# [[PackageOverrides]]) — это правка ЭТОГО файла через ревью, с причиной и сроком;
# исключение из дерева проекта не действует и действовать не должно.
